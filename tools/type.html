<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>Type</title>
<style>
	* { box-sizing: border-box; margin: 0; padding: 0; }
	body { font: 1.125rem/1.25 system-ui, sans-serif; height: 100dvh; color: CanvasText; background: pink; }
	main { display: flex; flex-flow: column nowrap; height: 100%; position: relative; }
	.chat { flex: 1; display: flex; flex-flow: column nowrap; padding: 1.25rem; background: Canvas; overflow: hidden; }
	.partner { transform: rotate(180deg); background: ButtonFace; border-bottom: 2px solid CanvasText; }
	.history { flex: 1; display: flex; flex-direction: column; gap: .75rem; padding: .5rem; list-style: none; overflow-y: auto; }
	.history li { max-width: 85%; padding: .75rem 1rem; border-radius: 1rem; word-break: break-word; }
	.sent { align-self: flex-end; background: Highlight; color: HighlightText; }
	.received { align-self: flex-start; background: ButtonFace; color: CanvasText; }
	.partner .received { background: Canvas; color: CanvasText; }
	textarea { font: inherit; height: 3.25rem; padding: .75rem 1rem; border: 1px solid GrayText; border-radius: 1.5rem; background: Canvas; color: CanvasText; resize: none; outline: none; }
	textarea:focus, button:focus { border-color: Highlight; outline: 2px solid Highlight; }
	.toolbar { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; gap: .5rem; z-index: 10; }
	.toolbar button { width: 2.5rem; height: 2.5rem; border-radius: 50%; border: 1px solid GrayText; background: Canvas; color: GrayText; font: inherit; font-size: 1.25rem; display: flex; align-items: center; justify-content: center; cursor: pointer; }
</style>
</head>
<body>
<main>
	<section class="chat partner" aria-label="Partner">
		<ul class="history">
		</ul>
		<textarea rows="2" placeholder="Type reply..." aria-label="Partner Message"></textarea>
	</section>
	<div class="toolbar">
		<button id="clear-button" aria-label="Clear Messages">X</button>
	</div>
	<section class="chat" aria-label="Host">
		<ul class="history">
		</ul>
		<textarea rows="2" placeholder="Type here..." aria-label="Host Message"></textarea>
	</section>
</main>

<script>
	const chats = Array.from(document.querySelectorAll('.chat'));
	chats.forEach(activeChat => {
		const textarea = activeChat.querySelector('textarea');
		textarea.addEventListener('keydown', (e) => {
			if (e.key === 'Enter' && !e.shiftKey) {
				e.preventDefault();
				
				const messageText = textarea.value.trim();
				if (messageText !== '') {
					chats.forEach(chat => {
						const history = chat.querySelector('.history');
						const li = document.createElement('li');
						
						li.textContent = messageText;
						li.classList.add(chat === activeChat ? 'sent' : 'received');
						
						history.appendChild(li);
						history.scrollTop = history.scrollHeight;
					});
					
					textarea.value = '';
				}
			}
		});
	});

	const clearButton = document.getElementById('clear-button');
	clearButton.addEventListener('click', () => {
		chats.forEach(chat => {
			chat.querySelector('.history').innerHTML = '';
		});
	});

	function resizeVisualViewport() {
		if (window.visualViewport) {
			//document.body.style.minHeight = "0";
			//document.body.style.height = `${window.visualViewport.height}px`;
			chats.forEach(chat => {
				const history = chat.querySelector('.history');
				history.scrollTop = history.scrollHeight;
			});
		}
	}
	if (window.visualViewport) {
		window.visualViewport.addEventListener('resize', resizeVisualViewport);
		window.visualViewport.addEventListener('scroll', resizeVisualViewport);
	}	
</script>
</body>
</html>
