<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Type</title>
	<style>
		:root {
			color-scheme: light;
			--page: light-dark(#eee, #333);
			--card: light-dark(#fff, #666);
			--border: light-dark(#ddd, #777);
			--text: light-dark(#444, #ccc);
			--gray-text: light-dark(#777, #777);
			--highlight: light-dark(#2278BB, #2278BB);
			--highlight-text: light-dark(#fff, #000);
		}		
		*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
		body { font: 1rem/1.25 system-ui, sans-serif; background: var(--page); color: var(--text); display: flex; flex-direction: column; min-height: 100dvh; }
		main { flex: 1; display: flex; flex-direction: column; gap: 0.5em; margin: 0.5em; min-height: 0; }
		#ttt { flex: 1; display: flex; flex-direction: column; }
		#ttt textarea { flex: 1 1 0; font: inherit; font-size: 1.5em; padding: 1rem; border: none; border-radius: 1rem; outline: none;  }
		#ttt textarea#output {  transform: rotate(180deg); overflow-y: auto; white-space: pre-wrap; background: #eee; }
		.toolbar { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; gap: .5rem; z-index: 10; }
		.toolbar button { width: 2.5rem; height: 2.5rem; border-radius: 50%; border: 1px solid var(--border); background: var(--card); color: var(--highlight); font-size: 1.5em; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
	<main>
		<section id="ttt">
			<textarea id="output" placeholder="Read here..." readonly></textarea>
			<div class="toolbar">
				<button class="clear" title="Clear">⊘</button>
				<button class="larger" title="Larger">+</button>
				<button class="contrast" title="Contrast">●</button>
				<button class="smaller" title="Smaller">−</button>
				<button class="close" title="Close">X</button>
			</div>
			<textarea id="input" placeholder="Type or dictate here..." autofocus></textarea>
		</section>
	</main>
	<script>

		const input = document.querySelector("textarea#input");
		const output = document.querySelector("textarea#output");
		input.addEventListener("input", () => {
			output.value = input.value;
			output.scrollTop = output.scrollHeight;
		});

		document.querySelector("button.clear").addEventListener("click", () => {
			output.value = "";
			input.value = "";
			input.focus();
		});

		function setFontSize(base, increment) {
			input.style.fontSize = (parseFloat(input.style.fontSize) || base) + increment + "em";
			output.style.fontSize = input.style.fontSize;
			input.scrollTop = input.scrollHeight;
			output.scrollTop = output.scrollHeight;
		}

		document.querySelector("button.larger").addEventListener("click", () => {
			setFontSize(1.5, 0.5);
		});

		document.querySelector("button.smaller").addEventListener("click", () => {
			setFontSize(1.5, -0.5);
		});

	</script>
</body>
</html>
