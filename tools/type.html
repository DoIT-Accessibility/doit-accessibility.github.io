<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="../site.css">
	<title>Type</title>
	<style>
		main { display: flex; flex-flow: column nowrap; gap: 1em; padding-bottom: 1em; }
		#input, #output { flex: 1 1 0; font-size: 1.5em; padding: .5em; }
		#output { transform: rotate(180deg); overflow-y: auto; white-space: pre-wrap; border: 1px solid #777; }
		#controls { text-align: center; }
		#controls button { min-width: 10em; }
	</style>
</head>
<body>
	<header></header>
	<main>
		<h1 class="visually-hidden">Type</h1>
		<textarea id="output" readonly></textarea>
		<textarea id="input" placeholder="Type here..." autofocus></textarea>
		<div id="controls"><button id="clear-button">Clear</button></div>
	</main>
	<footer><a href=".."><span>Home</span></a> Last Updated: 2026-11-10</footer>
	<script>

		const input = document.getElementById('input');
		const output = document.getElementById('output');
		input.addEventListener('input', () => {
			output.value = input.value;
			output.scrollTop = output.scrollHeight;
		});

		const clearButton = document.getElementById("clear-button");
		clearButton.addEventListener('click', () => {
			input.value = '';
			output.value = '';
			input.focus();
		});

		function resizeVisualViewport() {
			if (window.visualViewport) {
				document.body.style.minHeight = "0";
				document.body.style.height = `${window.visualViewport.height}px`;
				output.scrollTop = output.scrollHeight;
			}
		}
		if (window.visualViewport) {
			window.visualViewport.addEventListener('resize', resizeVisualViewport);
			window.visualViewport.addEventListener('scroll', resizeVisualViewport);
		}		
	</script>
</body>
</html>
